<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1</title>
        <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
        <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" rel="stylesheet">
</head>
<body>
    <ion-header>
        <ion-toolbar>
            <ion-title>My first project</ion-title>
        </ion-toolbar>
    </ion-header>    

    <ion-button>Click me!</ion-button>

<ion-list>
            <ion-item>
                <ion-label>Element 1</ion-label>
            </ion-item>
            <ion-item>
                <ion-label>Element 2</ion-label>
            </ion-item>
        </ion-list>
        
        <ion-item>
            <ion-label position="floating">Arkadii Kyrylov</ion-label>
            <ion-input type="text" placeholder="Type your name:"></ion-input>
        </ion-item>

        <ion-button expand="full" color="primary" onclick="showToast()">Show message</ion-button>
    </ion-content>

    <ion-toast
        id="success-toast"
        message="Operation completed"
        duration="2000"
        position="top"
        color="success">
    </ion-toast>

    <script>
        function showToast(){
            const toast = document.getElementById('success-toast');
            toast.present();
        }
    </script>
</body>
</html>
